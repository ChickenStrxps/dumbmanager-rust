[package]
name = "dumbmanager-card-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Bounded native ASCII card renderer for DumbManager Rust"
autotests = false
autoexamples = false

[lib]
test = false
doctest = false

[dependencies]
font8x8 = "0.3.1"
fontdue = "0.9"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gif = "0.14.2"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
