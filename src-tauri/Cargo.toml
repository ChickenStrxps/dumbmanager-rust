[package]
name = "dumbmanager-rust"
version = "0.1.0"
description = "DumbManager Rust: isolated native Windows companion (Tauri 2)"
edition = "2021"
rust-version = "1.87"
publish = false
default-run = "dumbmanager-rust"

# No [workspace] table here on purpose. The domain crate in ./core is a path
# dependency; test it with `cargo test -p dumbmanager-core -p dumbmanager-rust`.
# If the repository later gets a root Cargo workspace, add "src-tauri" (and
# "src-tauri/core") as members there; nothing in this file needs to change.

[lib]
name = "dumbmanager_rust_lib"
crate-type = ["rlib"]

[[bin]]
name = "dumbmanager-rust"
path = "src/main.rs"

[features]
default = []
# Manual WebView IPC QA only; this feature refuses release builds.
desktop-qa = []

[[example]]
name = "native-ui-qa"
path = "examples/native-ui-qa.rs"
required-features = ["desktop-qa"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dumbmanager-core = { path = "core" }
# Parent-owned native card renderer (docs/renderer-contract.md). It is plugged
# in only through src/card.rs; core checks everything it writes.
dumbmanager-card-renderer = { path = "../crates/card-renderer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
