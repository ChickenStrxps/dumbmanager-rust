[package]
name = "dumbmanager-rust"
version = "0.1.0"
description = "DumbManager Rust: isolated native Windows companion (Tauri 2)"
edition = "2021"
rust-version = "1.90"
publish = false
default-run = "dumbmanager-rust"
autotests = false
autoexamples = false

[lib]
name = "dumbmanager_rust_lib"
crate-type = ["rlib"]
test = false
doctest = false

[[bin]]
name = "dumbmanager-rust"
path = "src/main.rs"
test = false

[[bin]]
name = "dumbmanager-mcp"
path = "src/bin/mcp.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dumbmanager-core = { path = "core" }
# Parent-owned native card renderer (docs/renderer-contract.md). It is plugged
# in only through src/card.rs; core checks everything it writes.
dumbmanager-card-renderer = { path = "../crates/card-renderer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
dirs = "7"
tiny_http = "0.12"
tauri = { version = "2.12", features = ["tray-icon"] }
feed-rs = "2.3"
scraper = "0.24"
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
