[package]
name = "dumbmanager-core"
version = "0.1.0"
description = "Headless domain logic for DumbManager Rust: itches, settings and safe exports. No Tauri dependency."
edition = "2021"
rust-version = "1.85"
publish = false
autotests = false
autoexamples = false

[lib]
test = false
doctest = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "component_updates"
path = "tests/component_updates.rs"
